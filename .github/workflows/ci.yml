docker_build_scout:
    name: Docker Build and Scout Scan
    runs-on: ubuntu-latest
    needs: [bandit_scan, semgrep_scan] # Espera a que terminen Bandit y Semgrep en paralelo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔑 Autenticación oficial obligatoria para que Docker Scout te dé derecho de uso
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pygoat:latest

      # 🔍 Escaneo nativo exigido con Docker Scout
      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: pygoat:latest
          only-severities: critical,high
