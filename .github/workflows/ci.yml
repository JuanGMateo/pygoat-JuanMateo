name: ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  bandit_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Permiso para subir reportes a la pestaña Security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit and formatter
        run: |
          pip install bandit bandit-sarif-formatter

      # Ejecuta Bandit omitiendo severidad baja (-ll) y confianza baja (-ii) en formato SARIF
      - name: Run Bandit
        run: bandit -r . -ll -ii -f sarif -o sast-bandit.sarif || true

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sast-bandit.sarif
          category: bandit

  semgrep_scan:
    name: Run Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Ejecuta Semgrep omitiendo severidades bajas (solo ERROR y WARNING) en formato SARIF
      - name: Run Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --severity=ERROR --severity=WARNING --sarif --output=sast-semgrep.sarif || true

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sast-semgrep.sarif
          category: semgrep

  docker_build_scout:
    name: Docker Build and Scout Scan
    runs-on: ubuntu-latest
    needs: [bandit_scan, semgrep_scan] # Espera a que terminen los análisis de código
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: pygoat:latest

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: pygoat:latest
          only-severities: critical,high
